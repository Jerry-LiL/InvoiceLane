services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invoicelane
      POSTGRES_PASSWORD: invoicelane
      POSTGRES_DB: invoicelane
    ports:
      - "5432:5432"
    volumes:
      - invoicelane-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoicelane -d invoicelane"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  invoicelane-pg:
